name: Collect public AI sources

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "23 */2 * * *"
    - cron: "31 */3 * * *"
    - cron: "43 */12 * * *"
  workflow_dispatch:
    inputs:
      connector:
        description: Connector to run (blank runs every due connector)
        required: false
        type: choice
        options: ["", rss, github, huggingface, arxiv]

permissions:
  contents: read

concurrency:
  group: signalwatch-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ./backend
      - name: Select connector
        id: connector
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CONNECTOR: ${{ inputs.connector }}
        run: |
          connector="$MANUAL_CONNECTOR"
          case "$SCHEDULE" in
            "17 * * * *") connector="rss" ;;
            "23 */2 * * *") connector="github" ;;
            "31 */3 * * *") connector="huggingface" ;;
            "43 */12 * * *") connector="arxiv" ;;
          esac
          echo "value=$connector" >> "$GITHUB_OUTPUT"
      - name: Collect due sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: signalwatch collect ${{ steps.connector.outputs.value && format('--connector {0}', steps.connector.outputs.value) || '' }}
