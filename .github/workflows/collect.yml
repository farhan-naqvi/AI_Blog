name: Collect public AI sources

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "23 */2 * * *"
    - cron: "31 */3 * * *"
    - cron: "43 */12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Safe smoke test or one connector
        required: true
        type: choice
        default: smoke
        options: [smoke, connector]
      connector:
        description: Connector used only when mode is connector
        required: true
        type: choice
        default: rss
        options: [rss, github, huggingface, arxiv]
      source_limit:
        description: Maximum due sources for a connector run
        required: true
        type: choice
        default: "2"
        options: ["1", "2", "5", "10"]
      item_limit:
        description: Maximum entries fetched from each source
        required: true
        type: choice
        default: "10"
        options: ["3", "10", "25", "50"]

permissions:
  contents: read

concurrency:
  group: signalwatch-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_COLLECTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ./backend
      - name: Select connector
        id: command
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_CONNECTOR: ${{ inputs.connector }}
          SOURCE_LIMIT: ${{ inputs.source_limit || vars.COLLECTION_SOURCE_LIMIT || '2' }}
          ITEM_LIMIT: ${{ inputs.item_limit || vars.COLLECTION_ITEM_LIMIT || '10' }}
        run: |
          if [[ "$MANUAL_MODE" == "smoke" ]]; then
            echo "value=signalwatch smoke-test-collectors" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          connector="$MANUAL_CONNECTOR"
          case "$SCHEDULE" in
            "17 * * * *") connector="rss" ;;
            "23 */2 * * *") connector="github" ;;
            "31 */3 * * *") connector="huggingface" ;;
            "43 */12 * * *") connector="arxiv" ;;
          esac
          test -n "$connector"
          [[ "$SOURCE_LIMIT" =~ ^[0-9]+$ ]]
          [[ "$ITEM_LIMIT" =~ ^[0-9]+$ ]]
          echo "value=signalwatch collect --connector $connector --source-limit $SOURCE_LIMIT --item-limit $ITEM_LIMIT" >> "$GITHUB_OUTPUT"
      - name: Collect due sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN || github.token }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: ${{ steps.command.outputs.value }}
