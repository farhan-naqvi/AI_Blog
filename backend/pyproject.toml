[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalwatch"
version = "0.1.0"
description = "Automation-first AI monitoring collectors and local Ollama worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "feedparser>=6.0.11,<7",
  "trafilatura>=2.0,<3",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "pytest-asyncio>=0.23,<1", "respx>=0.21,<1"]

[project.scripts]
signalwatch = "signalwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signalwatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
